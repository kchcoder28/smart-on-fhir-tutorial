<!DOCTYPE html>
<html>
<head><meta charset="utf-8"/><title>OAuth2 Callback</title></head>
<body>
  <h1>OAuth2 Callback</h1>
  <pre id="output">Waiting for token exchange…</pre>

  <script src="./lib/fhir-client-v0.1.11.js"></script>
  <script src="./lib/fhir-client-cerner-additions-1.0.0.js"></script>
  <script>
    FHIR.oauth2.ready(
      smart => {
        // dump the token response so we know it worked
        document.getElementById('output').textContent =
          JSON.stringify(smart.tokenResponse, null,2);
      },
      err => {
        document.getElementById('output').textContent = 'Error: ' + err;
      }
    );
  </script>
</body>
</html>
